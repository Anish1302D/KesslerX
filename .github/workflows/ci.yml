name: KesslerX CI & PR Merge Checks

on:
  push:
    branches: [main, master, "enhancement/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality, Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check (Zero Errors Target)
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npx tsc -b --noEmit

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Production Build Artifacts
        run: |
          test -f dist/index.html
          ls -lh dist/assets

      - name: Unit & Component Tests (Vitest)
        run: npm test -- --run

  backend:
    name: Backend API & Orbital Mechanics Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        env:
          TESTING: "1"
          PYTHONPATH: backend
        run: |
          python -m pytest -v backend

  safety-and-security:
    name: Aerospace Safety & Secret Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Mandatory Decision-Support Disclaimers
        run: |
          grep -q "Decision support only — human approval required" backend/negotiator_engine.py
          grep -q "Decision support only — human approval required" src/components/negotiator/IntentNegotiatorCockpit.tsx
          grep -q "Decision support only — human approval required" src/components/layout/GlobalProvenanceBanner.tsx

      - name: Verify Firestore Security Rules
        run: |
          test -f firestore.rules
          grep -q "rules_version = '2';" firestore.rules

      - name: Check Tracked Source Code for Leaked Private Keys
        run: |
          if git grep -I "BEGIN PRIVATE KEY" -- "src/" "backend/*.py"; then
            echo "Error: Private key material detected in source files!"
            exit 1
          fi

  pr-merge-gate:
    name: PR Merge Readiness Gate
    if: always()
    needs: [frontend, backend, safety-and-security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate All CI Checks
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.safety-and-security.result }}" != "success" ]]; then
            echo "One or more required pre-merge checks failed."
            exit 1
          fi
          echo "All KesslerX pre-merge CI checks passed."
