# Render Blueprint – KesslerX Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kesslerx-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SPACE_TRACK_USERNAME
        sync: false          # set manually in Render dashboard
      - key: SPACE_TRACK_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FRONTEND_ORIGIN
        value: "https://kessler-x.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://kessler-x.vercel.app,http://localhost:5173,http://localhost:3000"
    healthCheckPath: /api/health
    autoDeploy: true
